name: Publish npm prerelease

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Bind workflow ref to package version
        run: |
          $version = node -p "require('./package.json').version"
          $expectedRef = "refs/tags/v$version"
          if ($env:GITHUB_REF -ne $expectedRef) {
            throw "Publish muss auf $expectedRef gestartet werden; erhalten: $env:GITHUB_REF"
          }

      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.node-version'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install npm with Trusted Publishing support
        run: npm install --global npm@11.19.0

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Run complete release suite
        run: npm test

      - name: Prove clean installation from both tarballs
        run: npm run test:npm-clean-install

      - name: Publish Windows API package
        run: |
          $version = node -p "require('./package.json').version"
          $existing = (& npm view "@yadimon/steuer-spar-erklaerung-api@$version" version --json 2>&1 | Out-String)
          if ($LASTEXITCODE -eq 0) {
            Write-Host "API $version ist bereits veröffentlicht; überspringe den idempotenten Wiederanlauf."
          } elseif ($existing -match 'E404|not in this registry') {
            npm publish --workspace @yadimon/steuer-spar-erklaerung-api --ignore-scripts --tag latest --access public
            if ($LASTEXITCODE -ne 0) { throw "API-Publish fehlgeschlagen." }
          } else {
            throw "API-Registrystatus konnte nicht sicher gelesen werden: $existing"
          }

      - name: Wait for exact API dependency in registry
        run: |
          $version = node -p "require('./package.json').version"
          $ready = $false
          foreach ($attempt in 1..30) {
            $visible = (& npm view "@yadimon/steuer-spar-erklaerung-api@$version" version --json 2>$null | Out-String).Trim('"', "`r", "`n", ' ')
            if ($LASTEXITCODE -eq 0 -and $visible -eq $version) { $ready = $true; break }
            Start-Sleep -Seconds 2
          }
          if (-not $ready) { throw "Exakte API-Dependency $version wurde nicht rechtzeitig sichtbar." }

      - name: Publish MCP package with exact API dependency
        run: |
          $version = node -p "require('./package.json').version"
          $existing = (& npm view "@yadimon/steuer-spar-erklaerung-mcp@$version" version --json 2>&1 | Out-String)
          if ($LASTEXITCODE -eq 0) {
            Write-Host "MCP $version ist bereits veröffentlicht; überspringe den idempotenten Wiederanlauf."
          } elseif ($existing -match 'E404|not in this registry') {
            npm publish --workspace @yadimon/steuer-spar-erklaerung-mcp --ignore-scripts --tag latest --access public
            if ($LASTEXITCODE -ne 0) { throw "MCP-Publish fehlgeschlagen." }
          } else {
            throw "MCP-Registrystatus konnte nicht sicher gelesen werden: $existing"
          }
